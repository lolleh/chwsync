<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#00695c">
	<title>CHW Field</title>
	<link rel="manifest" href="./manifest.webmanifest">
	<link rel="icon" href="./icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="./icon.svg">
	<link rel="stylesheet" href="./app.css">
</head>
<body>
	<header class="appbar">
		<h1>CHW Field</h1>
		<span id="status" class="status">starting</span>
	</header>

	<nav class="tabs" id="tabs" hidden>
		<button data-tab="patients" class="active">Patients</button>
		<button data-tab="households">Households</button>
		<button data-tab="appointments">Appointments</button>
		<button data-tab="referrals">Referrals</button>
		<button data-tab="sync">Sync</button>
	</nav>

	<main id="view">
		<div class="empty">Loading…</div>
	</main>

	<div id="modal-root"></div>
	<div id="toast-root"></div>

	<script type="module" src="./js/app.js"></script>
</body>
</html>
